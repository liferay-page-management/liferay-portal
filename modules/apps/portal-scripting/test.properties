##
## Test Suites
##

    modified.files.includes[relevant][portal-scripting-rule]=**

    relevant.rule.names=\
        portal-scripting-rule

    test.batch.names[relevant][portal-scripting-rule]=\
        functional-tomcat90-postgresql155-jdk8,\
        modules-integration-postgresql155-jdk8,\
        modules-unit-jdk8

    #
    # Portal Hotfix Release
    #

    test.batch.run.property.query[functional-bundle-tomcat-postgresql155-jdk8][test-portal-hotfix-release]=\
        ${test.batch.run.property.query[functional-tomcat*-postgresql*-jdk8][relevant][portal-scripting-rule]}

    #
    # Relevant
    #

    modules.includes.required.test.batch.class.names.includes[modules-integration-postgresql155-jdk8][relevant][portal-scripting-rule]=\
        apps/portal-scripting/**/*Test.java

    modules.includes.required.test.batch.class.names.includes[modules-unit-jdk8][relevant][portal-scripting-rule]=\
        apps/portal-scripting/**/*Test.java

    test.batch.run.property.query[functional-tomcat*-postgresql*-jdk8][relevant][portal-scripting-rule]=\
        (portal.acceptance == true) AND \
        (testray.main.component.name == "Server Administration")

##
## Testray
##

    testray.main.component.name=Server Administration