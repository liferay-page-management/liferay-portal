##
## Test Suites
##

    modified.files.includes[relevant][calendar-rule]=**

    relevant.rule.names=\
        calendar-rule

    test.batch.names[relevant][calendar-rule]=\
        functional-tomcat90-postgresql155-jdk8,\
        functional-upgrade-tomcat90-postgresql155-jdk8,\
        modules-integration-postgresql155-jdk8,\
        modules-unit-jdk8

    #
    # Portal Hotfix Release
    #

    test.batch.run.property.query[functional-bundle-tomcat-postgresql155-jdk8][test-portal-hotfix-release]=\
        ${test.batch.run.property.query[functional-tomcat*-postgresql*-jdk8][relevant][calendar-rule]}

    #
    # Relevant
    #

    modules.includes.required.test.batch.class.names.includes[modules-integration-postgresql155-jdk8][relevant][calendar-rule]=\
        apps/calendar/**/*Test.java

    modules.includes.required.test.batch.class.names.includes[modules-unit-jdk8][relevant][calendar-rule]=\
        apps/calendar/**/*Test.java

    test.batch.run.property.query[functional-tomcat*-postgresql*-jdk8][relevant][calendar-rule]=\
        (portal.acceptance == true) AND \
        (\
            (testray.component.names ~ "Calendar") OR \
            (testray.main.component.name ~ "Calendar")\
        )

    test.batch.run.property.query[functional-upgrade-tomcat*-postgresql*-jdk8][relevant][calendar-rule]=\
        (testray.main.component.name == "Upgrades Calendar")

##
## Testray
##

    testray.main.component.name=Calendar